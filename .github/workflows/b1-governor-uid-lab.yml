name: B1 Governor UID laboratory
on:
  push:
    branches: [fix/b1-governor-uid-lab]
  pull_request:
    paths:
      - w2_integration/b1_governor_uid_provider.py
      - w2_integration/test_b1_governor_uid_provider.py
      - tests/test_b1_governor_uid_linux.py
      - .github/workflows/b1-governor-uid-lab.yml
permissions:
  contents: read
jobs:
  governor-uid:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            sep: ':'
          - os: windows-latest
            sep: ';'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TENIR_ENV: test
      HOST_SCOPE: single-host
      PYTHONPATH: ${{ github.workspace }}${{ matrix.sep }}${{ github.workspace }}/w2_integration
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and record exact source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p evidence
          git rev-parse HEAD | tee evidence/sha.txt
          python -m pip install -e '.[test,ep02]'
          python -m pip check
          python -m pip freeze > evidence/dependencies.txt
      - name: Governor and native authorization regressions
        run: |
          set -euo pipefail
          python -m pytest -q -rx -o addopts= w2_integration/test_b1_governor_uid_provider.py w2_integration/test_b1_generic_provider_fence.py w2_integration/test_b1_approved_uid_protocol.py w2_integration/test_positive_uid_protocol.py w2_integration/test_b1_untrusted_verifier.py w2_integration/test_positive_process_exit_fence.py w2_integration/test_positive_provider_review_latch.py w2_integration/test_positive_grant_exact_replay.py w2_integration/test_jw03_dispatch_right.py w2_integration/test_jw04_witness_binding.py w2_integration/test_jw09_positive_g4a.py w2_integration/test_jw10_b1_isolation.py w2_integration/test_jw11_custody.py w2_integration/test_jw12_close_open.py w2_integration/test_native_positive.py w2_integration/test_native_cross_boundary.py w2_integration/test_native_dispatch_adapter.py w2_integration/test_native_reservation_owner.py tests/test_provider.py tests/test_ep02_governor_commit_gate.py --junitxml=evidence/regression.xml
      - name: Stage read-only source for UID test
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo mkdir -p /run/tenir-governor-source/tests
          sudo cp -a tenir_governance tenir_kernel w2_integration /run/tenir-governor-source/
          sudo cp tests/test_b1_governor_uid_linux.py /run/tenir-governor-source/tests/
          sudo chown -R root:root /run/tenir-governor-source
          sudo find /run/tenir-governor-source -type d -exec chmod 755 {} +
          sudo find /run/tenir-governor-source -type f -exec chmod 444 {} +
          diff -rq tenir_governance /run/tenir-governor-source/tenir_governance
          diff -rq tenir_kernel /run/tenir-governor-source/tenir_kernel
          diff -rq w2_integration /run/tenir-governor-source/w2_integration
      - name: Verify Governor and peer UID isolation
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo -E env PATH="$PATH" PYTHONPATH=/run/tenir-governor-source:/run/tenir-governor-source/w2_integration PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 TENIR_ENV=test HOST_SCOPE=single-host python -m pytest -q -rs -o addopts= /run/tenir-governor-source/tests/test_b1_governor_uid_linux.py --junitxml="$PWD/evidence/uid.xml" 2>&1 | tee evidence/uid.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1-governor-uid-${{ matrix.os }}-${{ github.run_id }}
          path: evidence/
