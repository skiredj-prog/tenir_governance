name: Publish TENIR-Gov Pitch Deck

on:
  push:
    branches: [main]
    paths:
      - 'docs/TENIR-Gov-Pitch-Deck.md'
      - '.github/workflows/deploy-pitch-deck.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build public site and PDF
        run: |
          python -m pip install --quiet reportlab
          mkdir -p _site
          python - <<'PY'
          from pathlib import Path
          from html import escape
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib.enums import TA_CENTER
          from reportlab.lib.units import mm
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer

          src = Path("docs/TENIR-Gov-Pitch-Deck.md").read_text(encoding="utf-8")
          html_parts = []
          for line in src.splitlines():
              if line.startswith("# "):
                  html_parts.append(f"<h1>{escape(line[2:])}</h1>")
              elif line.startswith("## "):
                  html_parts.append(f"<h2>{escape(line[3:])}</h2>")
              elif line.startswith("- "):
                  html_parts.append(f"<li>{escape(line[2:])}</li>")
              elif not line.strip():
                  html_parts.append("<div class='spacer'></div>")
              else:
                  html_parts.append(f"<p>{escape(line)}</p>")

          html = """<!doctype html><html lang="en"><head>
          <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>TENIR-Gov — Runtime admissibility for autonomous AI agents</title>
          <style>
          :root{--bg:#0b0d10;--fg:#f2f3f5;--muted:#a8adb7;--line:#272b32}
          *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
          main{max-width:900px;margin:0 auto;padding:72px 28px 100px}h1{font-size:clamp(32px,6vw,56px);line-height:1.05;letter-spacing:-.03em;margin:0 0 42px}
          h2{font-size:28px;margin:58px 0 18px;border-top:1px solid var(--line);padding-top:28px}p{color:#d7dae0;margin:10px 0}
          li{color:#d7dae0;margin:8px 0}.spacer{height:8px}.meta{color:var(--muted);margin-bottom:38px}
          .download{display:inline-block;border:1px solid #555;padding:11px 16px;border-radius:8px;text-decoration:none;margin-bottom:28px;color:#fff}
          </style></head><body><main>
          <div class="meta">TENIR-Gov · Pitch Deck</div>
          <a class="download" href="TENIR-Gov-Pitch-Deck.pdf">Download PDF</a>
          """ + "\n".join(html_parts) + """
          </main></body></html>"""
          Path("_site/index.html").write_text(html, encoding="utf-8")

          out = "_site/TENIR-Gov-Pitch-Deck.pdf"
          doc = SimpleDocTemplate(out, pagesize=A4, rightMargin=18*mm, leftMargin=18*mm, topMargin=18*mm, bottomMargin=18*mm)
          styles = getSampleStyleSheet()
          title = ParagraphStyle("DeckTitle", parent=styles["Title"], alignment=TA_CENTER, fontSize=24, leading=28, spaceAfter=18)
          h2 = ParagraphStyle("DeckH2", parent=styles["Heading2"], fontSize=15, leading=19, spaceBefore=12, spaceAfter=7)
          body = ParagraphStyle("DeckBody", parent=styles["BodyText"], fontSize=9.5, leading=13)
          story=[]
          for line in src.splitlines():
              if line.startswith("# "):
                  story += [Paragraph(escape(line[2:]), title), Spacer(1,8)]
              elif line.startswith("## "):
                  story.append(Paragraph(escape(line[3:]), h2))
              elif line.startswith("- "):
                  story.append(Paragraph("• " + escape(line[2:]), body))
              elif line.strip():
                  story.append(Paragraph(escape(line), body))
              else:
                  story.append(Spacer(1,5))
          doc.build(story)
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
