name: Raft backend regression tests
# Covers Raft state, governor dispatch, provider reconciliation, checker correctness, and crash-recovery paths.

on:
  pull_request:
    paths:
      - "tenir_governance/operations/**"
      - "tenir_governance/composition/**"
      - "tenir_governance/membrane/**"
      - "tenir_governance/objects/**"
      - "tenir_governance/assessment/**"
      - "tenir_kernel/**"
      - "tests/**"
      - ".github/workflows/raft-backend-tests.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "tenir_governance/operations/**"
      - "tenir_governance/composition/**"
      - "tenir_governance/membrane/**"
      - "tenir_governance/objects/**"
      - "tenir_governance/assessment/**"
      - "tenir_kernel/**"
      - "tests/**"
      - ".github/workflows/raft-backend-tests.yml"
      - "pyproject.toml"

jobs:
  raft-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TENIR_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,raft]"
          python -m pip check
      - name: Run Raft regression suite
        run: pytest -q tests/test_raft_backend.py
      - name: Run governor and membrane regression suite
        run: pytest -q tests/test_composition.py
      - name: Run provider reconciliation regressions
        run: pytest -q tests/test_provider.py
      - name: Run linearizability checker regressions
        run: pytest -q tests/test_linearizability_checker.py
      - name: Run single-host budget regressions
        run: pytest -q tests/test_liveness.py
      - name: Run HOLD lifecycle regressions
        run: pytest -q tests/test_hold_lifecycle.py
      - name: Run SQLite cross-store crash recovery campaign
        run: pytest -q tests/test_sqlite_governor_crash_recovery.py
      - name: Validate subprocess source provenance and Decimal state
        run: pytest -q tests/test_subprocess_provenance.py
      - name: Test atomic interprocess quarantine and verified unlock
        run: pytest -q tests/test_quarantine_cross_registry.py

  packaging-preflight:
    name: ${{ matrix.checkout == 'candidate' && 'Python 3.12 exact candidate preflight (no publishing)' || 'Python 3.12 packaging preflight (no publishing)' }}
    strategy:
      fail-fast: false
      matrix:
        checkout: [candidate, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TENIR_ENV: test
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.checkout == 'candidate' && github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Record and verify checkout provenance
        env:
          EXPECTED_CHECKOUT_SHA: ${{ matrix.checkout == 'candidate' && github.event.pull_request.head.sha || github.sha }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_KIND: ${{ matrix.checkout }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          actual = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          evidence = {
              "checkout_kind": os.environ["CHECKOUT_KIND"],
              "actual_checkout_sha": actual,
              "expected_checkout_sha": os.environ["EXPECTED_CHECKOUT_SHA"],
              "candidate_sha": os.environ["CANDIDATE_SHA"],
              "github_sha": os.environ["GITHUB_SHA"],
              "event_name": os.environ["GITHUB_EVENT_NAME"],
              "run_id": os.environ["GITHUB_RUN_ID"],
          }
          Path("validation").mkdir(exist_ok=True)
          Path("validation/provenance.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(json.dumps(evidence, indent=2))
          if actual != evidence["expected_checkout_sha"]:
              raise SystemExit("Checkout SHA mismatch; candidate validation refused")
          PY
      - name: Verify candidate version without creating a tag
        run: |
          python - <<'PY'
          from pathlib import Path
          import tomllib
          assert tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"] == "5.7.0"
          print("Preflight candidate version 5.7.0 confirmed; no tag/publish")
          PY
      - name: Install test and build tools
        run: python -m pip install --upgrade pip build twine

      - name: Install project with test dependencies
        run: |
          python -m pip install -e ".[api,test,raft]"
          python -m pip check

      - name: Verify Raft tests run with explicitly declared non-production scope
        env:
          TENIR_ENV: test
        run: |
          python -c "import pysyncobj"
          python -m pytest tests/test_raft_backend.py -q --junitxml=validation/raft-tests.xml

      - name: Run the full test suite
        env:
          TENIR_ENV: test
        run: python -m pytest tests/ -q -ra --junitxml=validation/full-tests.xml

      - name: Build wheel and source distribution
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Verify required modules are in both distributions
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          required = {
              "tenir_governance/operations/provider.py",
              "tenir_governance/operations/hold.py",
              "tenir_governance/assessment/__init__.py",
              "tenir_governance/assessment/tau_inversion.py",
              "tenir_governance/assessment/evp.py",
              "tenir_governance/assessment/assessor.py",
          }
          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected exactly one wheel and sdist; got {len(wheels)} wheel(s), {len(sdists)} sdist(s)")

          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = set(archive.namelist())
          missing_wheel = sorted(required - wheel_names)
          if missing_wheel:
              raise SystemExit(f"Wheel is missing required modules: {missing_wheel}")

          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = {name.split("/", 1)[1] for name in archive.getnames() if "/" in name}
          missing_sdist = sorted(required - sdist_names)
          if missing_sdist:
              raise SystemExit(f"Source distribution is missing required modules: {missing_sdist}")

          print("Wheel and source distribution contain provider, HOLD, and assessment modules.")
          PY

      - name: Preserve checkout and test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: v57-${{ matrix.checkout }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: validation/
          if-no-files-found: warn
          retention-days: 30

