name: Raft backend regression tests
# Covers Raft state, governor dispatch, provider reconciliation, and checker correctness.

on:
  pull_request:
    paths:
      - "tenir_governance/operations/**"
      - "tenir_governance/composition/**"
      - "tenir_governance/membrane/**"
      - "tests/test_raft_backend.py"
      - "tests/test_composition.py"
      - "tests/test_provider.py"
      - "tests/test_linearizability_checker.py"
      - "tests/test_liveness.py"
      - "r5_hardened/IRON_OMEGA_R5/r5_server.py"
      - "r5_hardened/IRON_OMEGA_R5/r5_distributed_crypto/merkle/distributed_ledger.py"
      - "r5_hardened/IRON_OMEGA_R5/test_r5_all.py"
      - ".github/workflows/raft-backend-tests.yml"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "tenir_governance/operations/**"
      - "tenir_governance/composition/**"
      - "tenir_governance/membrane/**"
      - "tests/test_raft_backend.py"
      - "tests/test_composition.py"
      - "tests/test_provider.py"
      - "tests/test_linearizability_checker.py"
      - ".github/workflows/raft-backend-tests.yml"
      - "pyproject.toml"

jobs:
  raft-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" "pysyncobj==0.3.17"
      - name: Run Raft regression suite
        run: pytest -q tests/test_raft_backend.py
      - name: Run governor and membrane regression suite
        run: pytest -q tests/test_composition.py
      - name: Run provider reconciliation regressions
        run: pytest -q tests/test_provider.py
      - name: Run linearizability checker regressions
        run: pytest -q tests/test_linearizability_checker.py
      - name: Run single-host budget regressions
        run: pytest -q tests/test_liveness.py
