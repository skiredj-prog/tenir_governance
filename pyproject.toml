[build-system]
requires      = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tenir-governance"
version = "5.2.0"
description = "TENIR-Gov: Governance Middleware for AI-Enabled Operational Systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["jsonschema>=4.22,<5"]
license = { text = "Apache-2.0" }
authors = [
    { name = "Abdelaziz Skiredj", email = "skiredj@gmail.com" }
]
keywords = [
    "governance", "middleware", "AI safety", "policy enforcement",
    "neuro-symbolic", "audit ledger", "Merkle tree", "autonomous agents",
    "compliance", "FastAPI", "Neo4j"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage      = "https://github.com/skiredj-prog/tenir_governance"
Repository    = "https://github.com/skiredj-prog/tenir_governance"
Documentation = "https://github.com/skiredj-prog/tenir_governance#readme"
"Bug Tracker" = "https://github.com/skiredj-prog/tenir_governance/issues"
DOI           = "https://doi.org/10.5281/zenodo.21277138"

[project.scripts]
tenir-validate = "tenir_governance.validator:main"
tenir-sdk      = "tenir_governance.sdk:main"
tenir-kernel    = "tenir_kernel.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "pydantic>=2.5,<3",
    "uvicorn[standard]>=0.30,<1",
]
r5 = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "jsonschema>=4.22,<5",
    "neo4j>=5.17,<7",
    "networkx>=3.2,<4",
    "pydantic>=2.5,<3",
    "uvicorn[standard]>=0.30,<1",
    "websockets>=12,<16",
]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<2",
    "pytest-cov>=5,<8",
]

[tool.setuptools]
packages = ["tenir_governance", "tenir_kernel", "tenir_kernel.connectors"]
include-package-data = true

[tool.setuptools.package-data]
tenir_kernel = ["schemas/*.json", "examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.coverage.run]
source = ["tenir_governance"]
omit   = ["tests/*"]
